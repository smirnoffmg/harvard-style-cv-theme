name: Automated Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') && !contains(github.event.head_commit.message, 'skip ci') }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Determine next version
      id: version
      run: |
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        RANGE=${LATEST_TAG:+$LATEST_TAG..}HEAD
        NEW_VERSION=$(git log --no-merges --format='%B%x00' "$RANGE" | .github/scripts/next-version.sh "$LATEST_TAG")
        
        if [ -z "$NEW_VERSION" ]; then
          echo "No releasable commits since ${LATEST_TAG:-the beginning}; skipping release."
        else
          echo "Latest tag: ${LATEST_TAG:-none}, new version: $NEW_VERSION"
        fi
        
        echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
        echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
        
    - name: Set up Ruby
      if: steps.version.outputs.new_version != ''
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true
        
    - name: Build Jekyll site
      if: steps.version.outputs.new_version != ''
      run: |
        bundle exec jekyll build
        
    - name: Create release archive
      if: steps.version.outputs.new_version != ''
      run: |
        cd _site
        zip -r ../harvard-cv-theme-v${{ steps.version.outputs.new_version }}.zip .
        
    - name: Create release
      if: steps.version.outputs.new_version != ''
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: v${{ steps.version.outputs.new_version }}
        LATEST_TAG: ${{ steps.version.outputs.latest_tag }}
      run: |
        gh release create "$VERSION" "harvard-cv-theme-$VERSION.zip" \
          --target "$GITHUB_SHA" \
          --title "Release $VERSION" \
          --generate-notes \
          ${LATEST_TAG:+--notes-start-tag "$LATEST_TAG"}
        
        echo "## Release $VERSION" >> "$GITHUB_STEP_SUMMARY"
        echo "- Previous tag: ${LATEST_TAG:-none}" >> "$GITHUB_STEP_SUMMARY"
